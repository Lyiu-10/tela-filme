<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessão de Filme</title>
<link rel="icon" href="data:,">
<style>
  [hidden] { display: none !important; }
  body { margin: 0; background: #000; color: #ddd; font: 16px system-ui, sans-serif; text-align: center; }
  .barra { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  input, button, select { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid #444; background: #1c1c1c; color: #eee; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #transmitirBtn { background: #2563eb; border-color: #2563eb; }
  #pararBtn { background: #dc2626; border-color: #dc2626; }
  p { margin: 6px 16px; }
  #info { color: #fbbf24; }
  #diag { color: #888; font-size: 13px; white-space: pre-line; }
  video { width: 100%; max-height: 80vh; background: #111; }
</style>

<form id="entrada" class="barra">
  <input id="nome" placeholder="Seu nome" maxlength="20" required>
  <button id="entrarBtn" disabled>Conectando...</button>
</form>
<div id="painel" hidden>
  <div class="barra">
    <button id="compartilharBtn">Copiar link da sala</button>
    <button id="transmitirBtn">Transmitir minha tela</button>
    <button id="trocarBtn" hidden>Trocar o que transmito</button>
    <button id="pararBtn" hidden>Parar de transmitir</button>
  </div>
  <div id="qualidade" class="barra" hidden>
    <label>Resolução <select id="resSel"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="0">Original</option></select></label>
    <label>FPS <select id="fpsSel"><option>30</option><option>60</option></select></label>
    <label>Internet por pessoa <select id="mbpsSel"><option>3</option><option selected>6</option><option>10</option></select> Mbps</label>
  </div>
  <p id="quem"></p>
  <p id="situacao"></p>
  <p id="diag"></p>
</div>
<p id="info"></p>
<video id="v" autoplay playsinline controls></video>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const sala = location.hash.slice(1);
const souDono = !sala;            // sem # na URL: eu crio a sala e organizo quem está nela
// ponytail: a sala vive na aba de quem criou; se essa aba fechar, a sala acaba
const peer = new Peer(souDono ? 'tf-' + Math.random().toString(36).slice(2, 8) : undefined);
const podeTransmitir = !!navigator.mediaDevices?.getDisplayMedia;   // celular não transmite tela

let estado = { membros: {}, transmissor: null };   // nome de cada um (por id) e quem transmite
let hub, dentro = false, tela = null, ultimoHub = 0, ultimoT = null, recebendo = null;
const conexoes = {}, chamadas = {}, vistos = {};
const aviso = t => $('info').textContent = t;

try { $('nome').value = localStorage.nome || ''; } catch {}
peer.on('open', () => {
  $('entrarBtn').disabled = false;
  $('entrarBtn').textContent = souDono ? 'Criar sala' : 'Entrar na sala';
});
peer.on('error', e => aviso(e.type === 'peer-unavailable' && !dentro
  ? 'Sala não encontrada: o link é velho ou quem criou a sala fechou a aba.'
  : 'Erro: ' + e.type));
addEventListener('beforeunload', () => peer.destroy());

$('entrada').onsubmit = e => {      // o clique também libera o som do vídeo no navegador
  e.preventDefault();
  const meuNome = $('nome').value.trim().slice(0, 20);
  if (!meuNome) return;
  try { localStorage.nome = meuNome; } catch {}
  $('entrada').hidden = true;
  if (souDono) {
    dentro = true;
    $('painel').hidden = false;
    aviso('Sala criada! Clique em "Copiar link da sala" e mande no grupo.');
    pedido(peer.id, { nome: meuNome });
    return;
  }
  aviso('Entrando...');
  hub = peer.connect(sala, { reliable: true });
  hub.on('open', () => {
    dentro = true;
    ultimoHub = Date.now();
    $('painel').hidden = false;
    aviso('');
    hub.send({ nome: meuNome });
  });
  hub.on('data', s => { ultimoHub = Date.now(); estado = s; render(); });
  hub.on('close', salaCaiu);
};
function salaCaiu() {
  if (!dentro) return;
  dentro = false;
  parar();
  hub.close();
  $('painel').hidden = true;
  $('v').srcObject = null;
  aviso('Você saiu da sala: quem criou fechou a aba ou a conexão caiu. Peça um link novo.');
}

// Sinal de vida a cada 5 s: quem some sem fechar a aba (PC dormiu, internet caiu) sai em ~15 s
setInterval(() => {
  if (!dentro) return;
  if (souDono) {
    for (const id in conexoes) if (Date.now() - vistos[id] > 15000) sair(id);
    publicar();                     // o estado reenviado é o sinal de vida do dono
  } else if (Date.now() - ultimoHub > 15000) salaCaiu();
  else if (hub.open) hub.send({ oi: 1 });
}, 5000);

// --- só o dono roda isto: recebe os pedidos e manda o estado da sala para todos ---
if (souDono) peer.on('connection', c => {
  c.on('open', () => { conexoes[c.peer] = c; vistos[c.peer] = Date.now(); });
  c.on('data', m => { vistos[c.peer] = Date.now(); if (!m?.oi) pedido(c.peer, m); });
  c.on('close', () => sair(c.peer));
});
function sair(id) {
  const c = conexoes[id];
  if (!c) return;
  delete conexoes[id];              // apaga antes do close(), que chama sair() de novo
  delete vistos[id];
  delete estado.membros[id];
  if (estado.transmissor === id) estado.transmissor = null;
  c.close();
  publicar();
}
function pedido(de, m) {
  if (!m) return;
  if (m.nome) estado.membros[de] = String(m.nome).slice(0, 20);
  if (m.transmitir && !estado.transmissor) estado.transmissor = de;   // um por vez: quem pedir primeiro
  if (m.parar && estado.transmissor === de) estado.transmissor = null;
  publicar();
}
function publicar() {
  for (const c of Object.values(conexoes)) if (c.open) c.send(estado);
  render();
}
const enviar = m => souDono ? pedido(peer.id, m) : hub.open && hub.send(m);

// --- vídeo: quem transmite liga para cada pessoa da sala ---
peer.on('call', c => {
  c.answer();
  recebendo = c;
  c.on('stream', s => { $('v').srcObject = s; $('v').muted = false; });
});

// --- diagnóstico a cada 3 s: o que sai (quem transmite) ou chega (quem assiste) ---
const anteriores = {};
async function medida(pc, lado, chave) {
  const r = await pc.getStats();
  let v, par;
  r.forEach(s => {
    if (s.type === lado && s.kind === 'video') v = s;
    if (s.type === 'transport') par = r.get(s.selectedCandidatePairId);
  });
  if (!v) return 'conectando...';
  const bytes = v.bytesSent ?? v.bytesReceived, a = anteriores[chave];
  anteriores[chave] = { b: bytes, t: v.timestamp };
  const mbps = a ? Math.max(0, (bytes - a.b) * 8 / (v.timestamp - a.t) / 1000) : 0;   // max: chamada nova zera o contador
  const tipo = r.get(par?.localCandidateId)?.candidateType;
  let txt = (v.frameWidth || 0) + 'x' + (v.frameHeight || 0) + ' · ' + Math.round(v.framesPerSecond || 0) + ' fps · ' + mbps.toFixed(1) + ' Mbps';
  if (tipo) txt += tipo === 'relay' ? ' · via retransmissor' : ' · direto';
  const freio = { bandwidth: 'internet', cpu: 'processador' }[v.qualityLimitationReason];
  if (freio) txt += ' · segurando por: ' + freio;
  if (v.packetsReceived) txt += ' · perda ' + (100 * v.packetsLost / (v.packetsLost + v.packetsReceived)).toFixed(1) + '%';
  return txt;
}
setInterval(async () => {
  const linhas = [], v = $('v');
  try {
    if (tela) {
      if (!tela.getAudioTracks().length) linhas.push('SEM SOM: pare, transmita de novo e escolha "Tela inteira" com "Compartilhar áudio do sistema" ligado (ou a guia/janela do filme com a opção de compartilhar o áudio dela ligada).');
      for (const id in chamadas) if (chamadas[id].peerConnection) {
        await ajustar(chamadas[id]).catch(() => {});   // pega quem entrou depois da última mudança
        linhas.push((estado.membros[id] || '?') + ': ' + await medida(chamadas[id].peerConnection, 'outbound-rtp', id));
      }
    } else if (recebendo?.peerConnection && v.srcObject) {
      if (!v.srcObject.getAudioTracks().length) linhas.push('Sem som: quem transmite não está mandando o áudio.');
      linhas.push('Chegando: ' + await medida(recebendo.peerConnection, 'inbound-rtp', 'eu'));
    }
  } catch {}
  $('diag').textContent = linhas.join('\n');
}, 3000);

const cfg = () => ({ res: +$('resSel').value, fps: +$('fpsSel').value, mbps: +$('mbpsSel').value });
async function capturar() {
  // surfaceSwitching: o Chrome mostra "Compartilhar esta guia" nas outras guias, troca sem cair
  // windowAudio 'window': ao escolher uma Janela, oferece só o som dela (Chrome 141+; navegador antigo ignora)
  const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: cfg().fps }, audio: true, surfaceSwitching: 'include', windowAudio: 'window' });
  const video = s.getVideoTracks()[0];
  video.contentHint = 'motion';     // filme: fluidez antes de nitidez de texto
  video.onended = () => { if (tela === s) parar(); };   // botão "Parar de compartilhar" do próprio Chrome
  return s;
}
$('transmitirBtn').onclick = async () => {
  try { tela = await capturar(); }
  catch (e) { aviso('Erro: ' + e.name + ' (cancelou ou negou a captura? clique de novo)'); return; }
  aviso('');
  enviar({ transmitir: true });
  render();
};
$('pararBtn').onclick = parar;

// Trocar a fonte no meio: troca a faixa dentro de cada ligação, sem derrubar ninguém
$('trocarBtn').onclick = async () => {
  let nova;
  try { nova = await capturar(); } catch { return; }   // cancelou: segue a de antes
  if (!tela) { nova.getTracks().forEach(t => t.stop()); return; }   // parou enquanto escolhia
  const velha = tela;
  tela = nova;
  for (const id in chamadas) {
    const pc = chamadas[id].peerConnection;
    const faixa = k => pc?.getTransceivers().find(t => t.receiver.track.kind === k)?.sender;
    const som = nova.getAudioTracks()[0] || null;
    if (faixa('video') && (faixa('audio') || !som)) {
      await faixa('video').replaceTrack(nova.getVideoTracks()[0]);
      if (faixa('audio')) await faixa('audio').replaceTrack(som);
    } else { chamadas[id].close(); delete chamadas[id]; }   // ligação sem canal de som: render() liga de novo
  }
  velha.getTracks().forEach(t => t.stop());
  aplicarQualidade();
  render();
};

// Qualidade ao vivo (como no Discord): muda o codificador de cada ligação, sem renegociar
async function ajustar(c) {
  const s = c.peerConnection?.getSenders().find(x => x.track?.kind === 'video');
  const p = s?.getParameters(), e = p?.encodings?.[0];
  if (!e || !tela) return;          // ainda negociando: o laço de 3 s tenta de novo
  const { res, fps, mbps } = cfg(), h = tela.getVideoTracks()[0].getSettings().height || res;
  const novo = { maxBitrate: mbps * 1e6, maxFramerate: fps, scaleResolutionDownBy: res ? Math.max(1, h / res) : 1 };
  if (Object.keys(novo).every(k => e[k] === novo[k])) return;
  Object.assign(e, novo);
  await s.setParameters(p);
}
function aplicarQualidade() {
  if (!tela) return;
  tela.getVideoTracks()[0].applyConstraints({ frameRate: cfg().fps }).catch(() => {});
  for (const id in chamadas) ajustar(chamadas[id]).catch(() => {});
}
['resSel', 'fpsSel', 'mbpsSel'].forEach(id => $(id).onchange = aplicarQualidade);

function parar() {
  if (!tela) return;
  tela.getTracks().forEach(t => t.stop());
  tela = null;
  for (const id in chamadas) { chamadas[id].close(); delete chamadas[id]; }
  enviar({ parar: true });
  render();
}

$('compartilharBtn').onclick = async () => {
  const link = location.origin + location.pathname + '#' + (sala || peer.id);
  try { await navigator.clipboard.writeText(link); $('compartilharBtn').textContent = 'Link copiado!'; }
  catch { aviso('Copie o link: ' + link); }
  setTimeout(() => $('compartilharBtn').textContent = 'Copiar link da sala', 2000);
};

function render() {
  const eu = peer.id, t = estado.transmissor, v = $('v');
  if (t !== ultimoT) { ultimoT = t; aviso(''); }   // mudou quem transmite: apaga aviso velho
  if (tela && t && t !== eu) {      // pedi junto com outra pessoa e ela chegou antes
    tela.getTracks().forEach(x => x.stop());
    tela = null;
    aviso(estado.membros[t] + ' começou a transmitir antes de você.');
  }
  const transmitindo = !!tela && t === eu;
  if (transmitindo) {
    for (const id in estado.membros)          // inclui quem entrou no meio do filme
      if (id !== eu && !chamadas[id]) chamadas[id] = peer.call(id, tela);
    if (v.srcObject !== tela) { v.srcObject = tela; v.muted = true; }   // prévia muda
  } else if (!t) v.srcObject = null;
  $('transmitirBtn').hidden = transmitindo || !podeTransmitir;
  $('transmitirBtn').disabled = !!t || !!tela;
  $('pararBtn').hidden = $('trocarBtn').hidden = $('qualidade').hidden = !transmitindo;
  $('quem').textContent = 'Na sala: ' + Object.values(estado.membros).join(', ');
  $('situacao').textContent = !t ? 'Ninguém transmitindo. Quem vai passar o filme?'
    : t === eu ? 'Você está transmitindo.' : estado.membros[t] + ' está transmitindo.';
}
</script>
