<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessão de Filme</title>
<style>
  body { margin: 0; background: #000; color: #ddd; font: 16px system-ui, sans-serif; text-align: center; }
  button { margin: 16px; padding: 12px 24px; font-size: 18px; cursor: pointer; }
  #info { margin: 8px 16px; word-break: break-all; user-select: all; }
  video { width: 100%; max-height: 85vh; background: #111; }
</style>
<button id="btn" disabled>Transmitir minha tela</button>
<p id="info">Conectando ao servidor...</p>
<video id="v" autoplay playsinline controls></video>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const peer = new Peer();
const sala = location.hash.slice(1);
peer.on('open', () => { btn.disabled = false; info.textContent = ''; });
peer.on('error', e => info.textContent = 'Erro: ' + e.type);

if (sala) {                                   // quem assiste
  btn.textContent = 'Assistir';               // o clique libera o som (autoplay do navegador)
  btn.onclick = () => { btn.hidden = true; info.textContent = 'Esperando a transmissão...'; peer.connect(sala); };
  peer.on('call', c => {
    c.answer();
    c.on('stream', s => { v.srcObject = s; info.textContent = ''; });
  });
} else {                                      // quem transmite
  btn.onclick = async () => {
    let tela;
    try { tela = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true }); }
    catch (e) { info.textContent = 'Erro: ' + e.name + ' (cancelou ou negou a captura? clique de novo)'; return; }
    tela.getVideoTracks()[0].contentHint = 'motion';   // filme: fluidez antes de nitidez de texto
    v.srcObject = tela; v.muted = true;
    btn.hidden = true;
    info.textContent = 'Mande este link: ' + location.href.split('#')[0] + '#' + peer.id;
    peer.on('connection', c => peer.call(c.peer, tela));
  };
}
</script>
